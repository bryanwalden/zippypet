name: Release Hardware Firmware

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install platformio pillow numpy

      - name: Generate include/Secrets.h
        run: |
          mkdir -p include
          cat << 'EOF' > include/Secrets.h
          #pragma once
          #define WIFI_SSID "YOUR_WIFI_SSID"
          #define WIFI_PASS "YOUR_WIFI_PASSWORD"
          EOF

      - name: Build sprites header
        run: python scripts/build_sprites.py

      - name: Compile M5StickS3 firmware
        run: pio run -e m5sticks3

      - name: Extract FIRMWARE_VERSION and write version.json
        id: get_version
        run: |
          VERSION=$(grep -E '^#define FIRMWARE_VERSION' include/Config.h | awk '{print $3}' | tr -d '\r')
          echo "Extracted Firmware Version: $VERSION"
          echo "{\"version\": $VERSION}" > version.json
          cat version.json
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Publish/Overwrite Rolling GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Zippypet Firmware (v${{ env.VERSION }})"
          prerelease: false
          draft: false
          files: |
            .pio/build/m5sticks3/firmware.bin
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

